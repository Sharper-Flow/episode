name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets --locked
      - name: Test
        # The end-to-end recall test is #[ignore] (needs Postgres + model
        # download), so this runs the unit suite without external services.
        run: cargo test --locked
      - name: Dependency advisories
        # Locked RustSec advisory check against Cargo.lock. Runs after the
        # `--locked` build so the lockfile is known-consistent; `--locked` keeps
        # the graph pinned. `vulnerability` fails CI; routine notices only warn
        # (see deny.toml). `rust-version: stable` is required because the crate
        # uses edition 2024 (cargo >= 1.85).
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable
          log-level: warn
          command: check
          command-arguments: advisories
          arguments: --locked
